{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/media.html">Media</a></li>
				<li><h1>Media Detail</h1></li>
			</ul>
		</div>
	</div>
	<div class="flex flex-wrap gap-2">
		<button class="btn btn-sm">
			<svg data-src="https://unpkg.com/heroicons/20/solid/arrow-down-tray.svg" class="size-4"></svg>
			Download
		</button>
		<button class="btn btn-sm btn-error">
			<svg data-src="https://unpkg.com/heroicons/20/solid/trash.svg" class="size-4"></svg>
			Delete
		</button>
	</div>
</header>
<!-- /header -->
<!-- form -->
<section class="col-span-12 grid gap-6 xl:grid-cols-[minmax(0,1fr)_24rem]">
	<div class="card bg-base-200 shadow-xs">
		<figure>
			<img
				class="max-h-[34rem] w-full object-contain"
				src="https://picsum.photos/1200/800?430"
				alt="Selected media preview" />
		</figure>
	</div>
	<aside class="card bg-base-200 shadow-xs">
		<div class="card-body">
			<h2 class="card-title">asset-14.jpg</h2>
			<fieldset class="fieldset">
				<label class="label">Alt text</label>
				<input
					type="text"
					class="input w-full"
					value="Dashboard analytics preview"
					aria-label="Dashboard analytics preview" />
			</fieldset>
			<fieldset class="fieldset">
				<label class="label">Caption</label>
				<input
					type="text"
					class="input w-full"
					value="Analytics report dashboard"
					aria-label="Analytics report dashboard" />
			</fieldset>
			<fieldset class="fieldset">
				<label class="label">Folder</label>
				<input type="text" class="input w-full" value="Blog" aria-label="Blog" />
			</fieldset>
			<textarea class="textarea min-h-24 w-full" aria-label="Text area">
Description and media usage notes.</textarea>
			<div class="grid grid-cols-2 gap-3 text-sm">
				<div>
					<span class="opacity-60">Dimensions</span>
					<br />
					1600 x 900
				</div>
				<div>
					<span class="opacity-60">Size</span>
					<br />
					512 KB
				</div>
				<div>
					<span class="opacity-60">Type</span>
					<br />
					JPEG
				</div>
				<div>
					<span class="opacity-60">Uploaded</span>
					<br />
					Today
				</div>
			</div>
			<input type="file" class="file-input w-full" aria-label="Choose file" />
			<button class="btn btn-primary">Save metadata</button>
		</div>
	</aside>
</section>
<!-- /form -->
{{> foot }}
