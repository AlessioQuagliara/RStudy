{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/media.html">Media</a></li>
				<li><h1>Media Settings</h1></li>
			</ul>
		</div>
	</div>
	<button class="btn btn-sm btn-primary">
		<svg data-src="https://unpkg.com/heroicons/20/solid/check.svg" class="size-4"></svg>
		Save settings
	</button>
</header>
<!-- /header -->
<!-- form -->
<section class="col-span-12 grid gap-6 xl:grid-cols-2">
	<div class="card bg-base-200 shadow-xs">
		<div class="card-body">
			<h2 class="card-title">
				<svg
					data-src="https://unpkg.com/heroicons/20/solid/document-arrow-up.svg"
					class="size-5"></svg>
				Upload rules
			</h2>
			<div class="grid gap-4">
				<fieldset class="fieldset">
					<label class="label">Allowed file types</label>
					<input
						type="text"
						class="input w-full"
						value="jpg, png, webp, mp4, pdf"
						aria-label="jpg, png, webp, mp4, pdf" />
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Max upload size</label>
					<input type="text" class="input w-full" value="100 MB" aria-label="100 MB" />
				</fieldset>
				<label class="label cursor-pointer justify-between">
					Scan uploads
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
			</div>
		</div>
	</div>
	<div class="card bg-base-200 shadow-xs">
		<div class="card-body">
			<h2 class="card-title">
				<svg data-src="https://unpkg.com/heroicons/20/solid/server.svg" class="size-5"></svg>
				Image and storage
			</h2>
			<div class="grid gap-4">
				<fieldset class="fieldset">
					<label class="label">Thumbnail size</label>
					<input type="text" class="input w-full" value="320 x 320" aria-label="320 x 320" />
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Large size</label>
					<input type="text" class="input w-full" value="1600 x 1200" aria-label="1600 x 1200" />
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">CDN domain</label>
					<input
						type="text"
						class="input w-full"
						value="cdn.example.com"
						aria-label="cdn.example.com" />
				</fieldset>
				<label class="label cursor-pointer justify-between">
					Optimize images
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
			</div>
		</div>
	</div>
</section>
<!-- /form -->
{{> foot }}
