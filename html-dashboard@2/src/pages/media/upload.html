{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/media.html">Media</a></li>
				<li><h1>Upload</h1></li>
			</ul>
		</div>
	</div>
	<a href="/media.html" class="btn btn-sm">
		<svg data-src="https://unpkg.com/heroicons/20/solid/photo.svg" class="size-4"></svg>
		Library
	</a>
</header>
<!-- /header -->
<!-- card -->
<section class="card bg-base-200 col-span-12 shadow-xs">
	<div class="card-body gap-5">
		<div class="rounded-box border-base-300 bg-base-100 border border-dashed p-10 text-center">
			<div class="mx-auto grid max-w-md gap-4">
				<div class="rounded-box bg-base-200 mx-auto p-5">
					<svg
						data-src="https://unpkg.com/heroicons/20/solid/cloud-arrow-up.svg"
						class="size-10"></svg>
				</div>
				<h2 class="card-title justify-center">Drop files to upload</h2>
				<input type="file" class="file-input w-full" multiple aria-label="Choose file" />
				<button class="btn btn-primary">Choose files</button>
			</div>
		</div>
		<div class="grid gap-4 lg:grid-cols-2">
			<div class="card bg-base-100 shadow-xs">
				<div class="card-body">
					<h2 class="card-title">
						<svg
							data-src="https://unpkg.com/heroicons/20/solid/queue-list.svg"
							class="size-5"></svg>
						Upload queue
					</h2>
					<ul class="list">
						<li class="list-row">
							<div>homepage-hero.jpg</div>
							<progress class="progress progress-primary w-40" value="68" max="100"></progress>
							<span>68%</span>
						</li>
						<li class="list-row">
							<div>product-demo.mp4</div>
							<progress class="progress progress-warning w-40" value="24" max="100"></progress>
							<span>24%</span>
						</li>
					</ul>
				</div>
			</div>
			<div class="card bg-base-100 shadow-xs">
				<div class="card-body">
					<h2 class="card-title">
						<svg
							data-src="https://unpkg.com/heroicons/20/solid/cog-6-tooth.svg"
							class="size-5"></svg>
						Upload settings
					</h2>
					<select class="select w-full" aria-label="Select option">
						<option selected>Folder: Products</option>
						<option>Blog</option>
						<option>Pages</option>
					</select>
					<label class="label cursor-pointer justify-between">
						Public media URL
						<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
					</label>
					<div class="alert alert-warning">Files over 20 MB require manual review.</div>
				</div>
			</div>
		</div>
	</div>
</section>
<!-- /card -->
{{> foot }}
