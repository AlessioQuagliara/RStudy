{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/messages.html">Messages</a></li>
				<li><h1>Edit Support Agent</h1></li>
			</ul>
		</div>
	</div>
	<div class="flex flex-wrap gap-2">
		<a href="/messages/agents.html" class="btn btn-sm">
			<svg data-src="https://unpkg.com/heroicons/20/solid/x-mark.svg" class="size-4"></svg>
			Cancel
		</a>
		<button class="btn btn-sm btn-primary">
			<svg data-src="https://unpkg.com/heroicons/20/solid/check.svg" class="size-4"></svg>
			Save agent
		</button>
	</div>
</header>
<!-- /header -->
<!-- form -->
<section class="col-span-12 grid gap-6 xl:grid-cols-[minmax(0,1fr)_22rem]">
	<div class="grid gap-6">
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/user.svg" class="size-5"></svg>
					Profile info
				</h2>
				<div class="grid gap-4 lg:grid-cols-2">
					<fieldset class="fieldset">
						<label class="label">Name</label>
						<input type="text" class="input w-full" value="Ari Lane" aria-label="Ari Lane" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Email</label>
						<input
							type="email"
							class="input w-full"
							value="ari@example.com"
							aria-label="ari@example.com" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Bio</label>
						<textarea class="textarea w-full" aria-label="Text area">
Senior support agent for billing and account escalations.</textarea>
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Avatar</label>
						<input type="file" class="file-input w-full" aria-label="Choose file" />
					</fieldset>
				</div>
			</div>
		</div>
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg
						data-src="https://unpkg.com/heroicons/20/solid/shield-check.svg"
						class="size-5"></svg>
					Support permissions
				</h2>
				<div class="grid gap-3 sm:grid-cols-2">
					<label class="label justify-start gap-3">
						<input
							type="checkbox"
							class="checkbox checkbox-sm"
							checked
							aria-label="Toggle option" />
						Reply to customers
					</label>
					<label class="label justify-start gap-3">
						<input
							type="checkbox"
							class="checkbox checkbox-sm"
							checked
							aria-label="Toggle option" />
						Issue refunds
					</label>
					<label class="label justify-start gap-3">
						<input type="checkbox" class="checkbox checkbox-sm" aria-label="Toggle option" />
						Edit orders
					</label>
					<label class="label justify-start gap-3">
						<input
							type="checkbox"
							class="checkbox checkbox-sm"
							checked
							aria-label="Toggle option" />
						Private notes
					</label>
				</div>
			</div>
		</div>
	</div>
	<aside class="grid content-start gap-6">
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg
						data-src="https://unpkg.com/heroicons/20/solid/building-office.svg"
						class="size-5"></svg>
					Departments
				</h2>
				<select class="select w-full" aria-label="Select option">
					<option selected>Billing</option>
					<option>Technical</option>
					<option>Returns</option>
				</select>
				<label class="label cursor-pointer justify-between">
					Auto assignment
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
			</div>
		</div>
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/bell.svg" class="size-5"></svg>
					Notifications
				</h2>
				<label class="label cursor-pointer justify-between">
					Email alerts
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
				<label class="label cursor-pointer justify-between">
					SLA alerts
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
			</div>
		</div>
	</aside>
</section>
<!-- /form -->
{{> foot }}
