{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-3 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/products.html">Products</a></li>
				<li>Add Product</li>
			</ul>
		</div>
	</div>
	<a href="/products.html" class="btn btn-sm">
		<svg data-src="https://unpkg.com/heroicons/20/solid/x-mark.svg" class="size-4"></svg>
		Cancel
	</a>
	<button class="btn btn-sm">
		<svg data-src="https://unpkg.com/heroicons/20/solid/document.svg" class="size-4"></svg>
		Save draft
	</button>
	<button class="btn btn-sm btn-primary">
		<svg data-src="https://unpkg.com/heroicons/20/solid/rocket-launch.svg" class="size-4"></svg>
		Publish product
	</button>
</header>
<!-- /header -->

<!-- form -->
<section class="col-span-12 grid gap-6 xl:grid-cols-[minmax(0,1fr)_22rem]">
	<div class="grid gap-6">
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/cube.svg" class="size-5"></svg>
					Product details
				</h2>
				<div class="grid gap-4 lg:grid-cols-2">
					<fieldset class="fieldset">
						<label class="label">Product name</label>
						<input
							class="input w-full"
							value="Launch Analytics Kit"
							aria-label="Launch Analytics Kit" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Slug</label>
						<input
							class="input w-full"
							value="launch-analytics-kit"
							aria-label="launch-analytics-kit" />
					</fieldset>
				</div>
				<fieldset class="fieldset">
					<label class="label">Description</label>
					<textarea class="textarea min-h-32 w-full" aria-label="Text area">
A reporting bundle for launch teams that need product, campaign, and conversion dashboards in one package.</textarea>
				</fieldset>
			</div>
		</div>
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/photo.svg" class="size-5"></svg>
					Media gallery
				</h2>
				<div class="grid gap-3 sm:grid-cols-3">
					<img
						class="rounded-box aspect-square object-cover"
						src="https://picsum.photos/360/360?51"
						alt="Primary product media" />
					<img
						class="rounded-box aspect-square object-cover"
						src="https://picsum.photos/360/360?52"
						alt="Secondary product media" />
					<button class="btn btn-dash h-full min-h-36">
						<svg data-src="https://unpkg.com/heroicons/20/solid/plus.svg" class="size-5"></svg>
						Add media
					</button>
				</div>
			</div>
		</div>
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/banknotes.svg" class="size-5"></svg>
					Pricing and inventory
				</h2>
				<div class="grid gap-4 lg:grid-cols-3">
					<fieldset class="fieldset">
						<label class="label">Price</label>
						<input class="input w-full" value="$420" aria-label="$420" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Compare-at price</label>
						<input class="input w-full" value="$560" aria-label="$560" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">SKU</label>
						<input class="input w-full" value="LAK-PRO" aria-label="LAK-PRO" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Stock</label>
						<input type="number" class="input w-full" value="180" aria-label="180" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Low-stock threshold</label>
						<input type="number" class="input w-full" value="24" aria-label="24" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Warehouse</label>
						<select class="select w-full" aria-label="Select option">
							<option selected>Primary digital</option>
							<option>East warehouse</option>
							<option>West warehouse</option>
						</select>
					</fieldset>
				</div>
			</div>
		</div>
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg
						data-src="https://unpkg.com/heroicons/20/solid/squares-plus.svg"
						class="size-5"></svg>
					Variants and metadata
				</h2>
				<div class="grid gap-4 lg:grid-cols-2">
					<fieldset class="fieldset">
						<label class="label">Options</label>
						<input
							class="input w-full"
							value="Monthly, Annual, Enterprise"
							aria-label="Monthly, Annual, Enterprise" />
					</fieldset>
					<fieldset class="fieldset">
						<label class="label">Weight</label>
						<input class="input w-full" value="Digital product" aria-label="Digital product" />
					</fieldset>
					<fieldset class="fieldset lg:col-span-2">
						<label class="label">Metadata</label>
						<textarea class="textarea min-h-24 w-full" aria-label="Text area">
source=launch, license=team, renewal=annual</textarea>
					</fieldset>
				</div>
			</div>
		</div>
	</div>
	<aside class="grid content-start gap-6">
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/cog-6-tooth.svg" class="size-5"></svg>
					Publishing
				</h2>
				<fieldset class="fieldset">
					<label class="label">Status</label>
					<select class="select w-full" aria-label="Select option">
						<option selected>Draft</option>
						<option>Active</option>
						<option>Archived</option>
					</select>
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Visibility</label>
					<select class="select w-full" aria-label="Select option">
						<option selected>Public catalog</option>
						<option>Private link</option>
						<option>Hidden</option>
					</select>
				</fieldset>
				<label class="label cursor-pointer justify-between">
					Featured product
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
			</div>
		</div>
		<div class="card bg-base-200 shadow-xs">
			<div class="card-body">
				<h2 class="card-title">
					<svg data-src="https://unpkg.com/heroicons/20/solid/tag.svg" class="size-5"></svg>
					Organization
				</h2>
				<fieldset class="fieldset">
					<label class="label">Category</label>
					<select class="select w-full" aria-label="Select option">
						<option selected>Software</option>
						<option>Services</option>
						<option>Templates</option>
					</select>
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Tags</label>
					<input
						class="input w-full"
						value="featured, recurring, analytics"
						aria-label="featured, recurring, analytics" />
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">SEO title</label>
					<input
						class="input w-full"
						value="Launch Analytics Kit"
						aria-label="Launch Analytics Kit" />
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Connected products</label>
					<input
						class="input w-full"
						value="Growth Suite, Commerce Pro"
						aria-label="Growth Suite, Commerce Pro" />
				</fieldset>
			</div>
		</div>
	</aside>
</section>
<!-- /form -->
{{> foot }}
