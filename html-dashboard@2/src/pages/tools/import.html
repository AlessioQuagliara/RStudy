{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-4 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/tools/import.html">Tools</a></li>
				<li><h1>Import</h1></li>
			</ul>
		</div>
	</div>
	<div class="flex flex-wrap gap-2">
		<button class="btn btn-sm">
			<svg data-src="https://unpkg.com/heroicons/20/solid/arrow-down-tray.svg" class="size-4"></svg>
			Download template
		</button>
	</div>
</header>
<!-- /header -->
<!-- card -->
<section class="card bg-base-200 col-span-12 shadow-xs">
	<div class="card-body">
		<h2 class="card-title">
			<svg data-src="https://unpkg.com/heroicons/20/solid/arrow-up-tray.svg" class="size-5"></svg>
			Import workflow
		</h2>
		<ul class="steps w-full">
			<li class="step step-primary">Upload</li>
			<li class="step">Confirm</li>
			<li class="step">Done</li>
		</ul>
		<div class="mt-6 grid gap-6 xl:grid-cols-[minmax(0,1fr)_20rem]">
			<div class="grid gap-4">
				<fieldset class="fieldset">
					<label class="label">Import file</label>
					<input type="file" class="file-input w-full" aria-label="Choose file" />
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Data type</label>
					<select class="select w-full" aria-label="Select option">
						<option>Products</option>
						<option>Users</option>
						<option>Orders</option>
						<option>Coupons</option>
						<option>Media metadata</option>
					</select>
				</fieldset>
				<fieldset class="fieldset">
					<label class="label">Duplicate handling</label>
					<div class="grid gap-2">
						<label class="label justify-start gap-2">
							<input
								type="radio"
								name="import-dupes"
								class="radio radio-sm"
								checked
								aria-label="Select option" />
							Update existing records
						</label>
						<label class="label justify-start gap-2">
							<input
								type="radio"
								name="import-dupes"
								class="radio radio-sm"
								aria-label="Select option" />
							Skip duplicates
						</label>
						<label class="label justify-start gap-2">
							<input
								type="radio"
								name="import-dupes"
								class="radio radio-sm"
								aria-label="Select option" />
							Create new versions
						</label>
					</div>
				</fieldset>
			</div>
			<div class="grid content-start gap-3">
				<label class="label justify-between">
					Validate only
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
				<label class="label justify-between">
					Create rollback point
					<input type="checkbox" class="toggle toggle-sm" checked aria-label="Toggle option" />
				</label>
				<label class="label justify-between">
					Email report
					<input type="checkbox" class="toggle toggle-sm" aria-label="Toggle option" />
				</label>
				<button class="btn btn-primary">Upload and preview</button>
			</div>
		</div>
	</div>
</section>
<!-- /card -->
<!-- card -->
<section class="card bg-base-200 col-span-12 shadow-xs">
	<div class="card-body">
		<h2 class="card-title">
			<svg data-src="https://unpkg.com/heroicons/20/solid/table-cells.svg" class="size-5"></svg>
			Recent imports
		</h2>
		<div class="overflow-x-auto">
			<table class="table">
				<thead>
					<tr>
						<th>File</th>
						<th>Type</th>
						<th>Rows</th>
						<th>Errors</th>
						<th>Result</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>products-july.csv</td>
						<td>Products</td>
						<td>8,420</td>
						<td>12</td>
						<td><span class="badge badge-warning badge-sm">Needs mapping</span></td>
					</tr>
					<tr>
						<td>vip-users.csv</td>
						<td>Users</td>
						<td>1,204</td>
						<td>0</td>
						<td><span class="badge badge-success badge-sm">Complete</span></td>
					</tr>
					<tr>
						<td>coupon-seed.csv</td>
						<td>Coupons</td>
						<td>480</td>
						<td>3</td>
						<td><span class="badge badge-info badge-sm">Validated</span></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
<!-- /card -->
{{> foot }}
