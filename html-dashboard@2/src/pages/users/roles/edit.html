{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-3 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/users.html">Users</a></li>
				<li><a href="/users/roles.html">Roles</a></li>
				<li>Edit Role</li>
			</ul>
		</div>
	</div>
	<button class="btn">
		<svg
			data-src="https://unpkg.com/heroicons/20/solid/document-duplicate.svg"
			class="size-4"></svg>
		Duplicate
	</button>
	<button class="btn btn-primary">
		<svg data-src="https://unpkg.com/heroicons/20/solid/check.svg" class="size-4"></svg>
		Save role
	</button>
</header>
<!-- /header -->
<!-- card -->
<section class="card bg-base-200 col-span-12 shadow-xs xl:col-span-4">
	<div class="card-body">
		<h2 class="card-title">
			<svg data-src="https://unpkg.com/heroicons/20/solid/shield-check.svg" class="size-5"></svg>
			Admin
		</h2>
		<fieldset class="fieldset">
			<label class="label">Role name</label>
			<input class="input w-full" value="Admin" aria-label="Admin" />
		</fieldset>
		<fieldset class="fieldset">
			<label class="label">Status</label>
			<select class="select w-full" aria-label="Select option">
				<option selected>Active</option>
				<option>Locked</option>
				<option>Archived</option>
			</select>
		</fieldset>
		<label class="label cursor-pointer justify-between">
			Default staff role
			<input type="checkbox" class="toggle toggle-sm" aria-label="Toggle option" />
		</label>
	</div>
</section>
<!-- /card -->
