{{> head }}
<!-- header -->
<header class="col-span-12 flex flex-col gap-3 lg:flex-row lg:items-end">
	<div class="grow">
		<div class="breadcrumbs text-sm">
			<ul>
				<li><a href="/users.html">Users</a></li>
				<li><a href="/users/roles.html">Roles</a></li>
				<li>Add Role</li>
			</ul>
		</div>
	</div>
	<a href="/users/roles.html" class="btn btn-sm">
		<svg data-src="https://unpkg.com/heroicons/20/solid/x-mark.svg" class="size-4"></svg>
		Cancel
	</a>
	<button class="btn btn-sm btn-primary">
		<svg data-src="https://unpkg.com/heroicons/20/solid/shield-check.svg" class="size-4"></svg>
		Create role
	</button>
</header>
<!-- /header -->
<!-- card -->
<section class="card bg-base-200 col-span-12 shadow-xs xl:col-span-5">
	<div class="card-body">
		<h2 class="card-title">
			<svg data-src="https://unpkg.com/heroicons/20/solid/identification.svg" class="size-5"></svg>
			Role details
		</h2>
		<fieldset class="fieldset">
			<label class="label">Role name</label>
			<input class="input w-full" value="Catalog manager" aria-label="Catalog manager" />
		</fieldset>
		<fieldset class="fieldset">
			<label class="label">Scope</label>
			<select class="select w-full" aria-label="Select option">
				<option>Global</option>
				<option selected>Commerce</option>
				<option>Support</option>
				<option>Content</option>
			</select>
		</fieldset>
		<fieldset class="fieldset">
			<label class="label">Description</label>
			<textarea class="textarea min-h-32 w-full" aria-label="Text area">
Can manage products, inventory, categories, and product performance reports.</textarea>
		</fieldset>
	</div>
</section>
<!-- /card -->
<!-- card -->
<section class="card bg-base-200 col-span-12 shadow-xs xl:col-span-7">
	<div class="card-body">
		<h2 class="card-title">
			<svg data-src="https://unpkg.com/heroicons/20/solid/key.svg" class="size-5"></svg>
			Permissions
		</h2>
		<div class="grid gap-4 md:grid-cols-2">
			<label class="label cursor-pointer justify-start gap-3">
				<input type="checkbox" class="checkbox checkbox-sm" checked aria-label="Toggle option" />
				View products
			</label>
			<label class="label cursor-pointer justify-start gap-3">
				<input type="checkbox" class="checkbox checkbox-sm" checked aria-label="Toggle option" />
				Edit products
			</label>
			<label class="label cursor-pointer justify-start gap-3">
				<input type="checkbox" class="checkbox checkbox-sm" checked aria-label="Toggle option" />
				Manage inventory
			</label>
			<label class="label cursor-pointer justify-start gap-3">
				<input type="checkbox" class="checkbox checkbox-sm" aria-label="Toggle option" />
				Manage transactions
			</label>
			<label class="label cursor-pointer justify-start gap-3">
				<input type="checkbox" class="checkbox checkbox-sm" aria-label="Toggle option" />
				Manage users
			</label>
			<label class="label cursor-pointer justify-start gap-3">
				<input type="checkbox" class="checkbox checkbox-sm" checked aria-label="Toggle option" />
				View analytics
			</label>
		</div>
	</div>
</section>
<!-- /card -->
{{> foot }}
