<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Dashboard</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Pineapple Tech dashboard for commerce operations, orders, products, customers, analytics, and system tools." />
		<link href="{{ outputCss }}" rel="stylesheet" />
		<!-- chart library -->
		<script
			type="module"
			src="https://cdn.jsdelivr.net/npm/@weblogin/trendchart-elements@1.1.0/dist/index.js/+esm"
			async></script>
		<!-- svg loader for icons -->
		<script
			src="https://cdn.jsdelivr.net/npm/external-svg-loader@1.6.10/svg-loader.min.js"
			async></script>
		<script src="https://cdn.jsdelivr.net/npm/theme-change@3/index.js"></script>
	</head>
	<body class="drawer lg:drawer-open min-h-screen bg-base-200">
		<input id="my-drawer" type="checkbox" class="drawer-toggle" aria-label="Toggle sidebar" />
		<main class="drawer-content bg-base-100 lg:mt-2 lg:border-t lg:border-s lg:border-base-300 lg:rounded-ss-4xl lg:[corner-start-start-shape:squircle] lg:bg-[radial-gradient(ellipse_50rem_30rem_at_50%_0%,color-mix(oklch(96%_0.008_68)_3%,transparent)_0%,transparent_80%)]">
			<div class="grid grid-cols-12 gap-6 p-4 lg:p-10">
				<header class="col-span-12 flex items-center gap-1">
					<label
						for="my-drawer"
						class="btn btn-square btn-ghost drawer-button lg:hidden"
						aria-label="Open sidebar">
						<svg data-src="https://unpkg.com/heroicons/20/solid/bars-3.svg" class="h-5 w-5"></svg>
					</label>
					<div class="grow">
						<h1 class="page-title lg:text-xl lg:font-light opacity-50">Dashboard</h1>
					</div>
					<div>
						<input type="text" placeholder="Search" class="input input-sm rounded-full" aria-label="Search" />
					</div>
					<label class="btn btn-circle btn-sm btn-ghost swap swap-rotate" aria-label="Toggle theme">
						<input type="checkbox" value="light" data-set-theme aria-label="Toggle theme" />
						<svg class="swap-on size-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
							<path
								d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
						</svg>
						<svg
							class="swap-off size-4 fill-current"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24">
							<path
								d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
						</svg>
					</label>

					<div class="z-10">
						<button
							class="btn btn-circle btn-sm btn-ghost"
							aria-label="Open notifications"
							popovertarget="header-notifications-dropdown"
							style="anchor-name: --header-notifications-anchor">
							<div class="indicator">
								<span class="status indicator-item status-error"></span>
								<svg data-src="https://unpkg.com/heroicons/20/solid/bell.svg" class="size-4"></svg>
							</div>
						</button>
						<ul
							class="menu dropdown rounded-box bg-base-100 mt-3 w-80 p-2 shadow-2xl"
							popover
							id="header-notifications-dropdown"
							style="position-anchor: --header-notifications-anchor">
							<li>
								<a class="gap-4">
									<div class="avatar">
										<div class="w-8 rounded-full">
											<img src="https://picsum.photos/80/80?1" alt="Alice avatar" />
										</div>
									</div>
									<span>
										<b>New message</b>
										<br />
										Alice: Hi, did you get my files?
									</span>
								</a>
							</li>
							<li>
								<a class="gap-4">
									<div class="avatar">
										<div class="w-8 rounded-full">
											<img src="https://picsum.photos/80/80?2" alt="Reminder notification avatar" />
										</div>
									</div>
									<span>
										<b>Reminder</b>
										<br />
										Your meeting is at 10am
									</span>
								</a>
							</li>
							<li>
								<a class="gap-4">
									<div class="avatar">
										<div class="w-8 rounded-full">
											<img src="https://picsum.photos/80/80?3" alt="John Doe avatar" />
										</div>
									</div>
									<span>
										<b>New payment</b>
										<br />
										Received $2500 from John Doe
									</span>
								</a>
							</li>
							<li>
								<a class="gap-4">
									<div class="avatar">
										<div class="w-8 rounded-full">
											<img src="https://picsum.photos/80/80?4" alt="Alice payment avatar" />
										</div>
									</div>
									<span>
										<b>New payment</b>
										<br />
										Received $1900 from Alice
									</span>
								</a>
							</li>
						</ul>
					</div>
					<div class="z-10">
						<button
							class="avatar btn btn-sm btn-circle btn-ghost"
							aria-label="Open profile menu"
							popovertarget="header-profile-dropdown"
							style="anchor-name: --header-profile-anchor">
							<div class="size-7 rounded-full">
								<img src="https://picsum.photos/80/80?5" alt="Current user avatar" />
							</div>
						</button>
						<ul
							class="menu dropdown rounded-box bg-base-100 mt-3 w-52 p-2 shadow-2xl"
							popover
							id="header-profile-dropdown"
							style="position-anchor: --header-profile-anchor">
							<li><a>Profile</a></li>
							<li>
								<a>
									Inbox
									<span class="badge badge-xs">12</span>
								</a>
							</li>
							<li><a>Settings</a></li>
							<li><a>Logout</a></li>
						</ul>
					</div>
				</header>
