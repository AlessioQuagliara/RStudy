# Migrazioni del database: `alembic upgrade head` (legge DATABASE_URL dall'ambiente, vedi migrations/env.py).
# Nuova revisione: `alembic revision --autogenerate -m "descrizione"`, poi rileggi il file generato.
[alembic]
script_location = %(here)s/migrations
# Rende importabile il pacchetto app da env.py.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
