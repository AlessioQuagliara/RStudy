# Traefik CONDIVISO del server: unico processo sulle porte 80/443, davanti a tutte le app (RStudy e le altre).
# Si avvia una volta sola, indipendente dalle app:
#   cd deploy/traefik && docker network create proxy && docker compose --env-file .env up -d
# Ogni app si aggancia alla rete esterna `proxy` e si dichiara con le label traefik.* (vedi ../../compose.prod.yaml).
# Se sul server gira già un Traefik, non avviare questo: riusa quello con rete `proxy`, resolver `cloudflare`
# e il file dynamic/cloudflare.yml.
name: traefik

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # X-Forwarded-* accettati solo da Cloudflare (https://www.cloudflare.com/ips/). Stessa lista di dynamic/cloudflare.yml.
      - --entrypoints.websecure.forwardedheaders.trustedips=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      # Certificati via DNS-01 su Cloudflare: funziona anche con il proxy arancione attivo (la TLS challenge no).
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:?imposta ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --accesslog=true
    environment:
      # Token API Cloudflare con permesso Zone > DNS > Edit, limitato alle zone servite. Segreto.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?imposta CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Sola lettura: Traefik legge le label dei container, non li gestisce.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks: [proxy]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

networks:
  proxy:
    external: true

volumes:
  letsencrypt:
