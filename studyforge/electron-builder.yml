appId: com.alessioquagliara.rstudy
productName: RStudy
# Icona sorgente unica (1024x1024, generata da assets/img/logo-mark.svg):
# electron-builder deriva automaticamente .icns (mac) e .ico (win) da questo
# PNG in fase di build, niente asset platform-specifici da mantenere a mano.
icon: build/icon.png
directories:
  output: release
# Target di pubblicazione per l'auto-update (electron-updater, vedi
# electron/services/updaterService.ts): pubblica gli installer + i file di
# metadati (latest.yml/latest-mac.yml/latest-linux.yml) come GitHub Release
# taggata "v<version>" sul repo pubblico. Serve un token con permesso
# "contents: write" nella variabile d'ambiente GH_TOKEN al momento della
# build (`GH_TOKEN=... pnpm release:mac`); senza GH_TOKEN electron-builder
# builda normalmente ma non pubblica nulla. NB: repo condiviso con altri
# progetti (web, landing page, ecc.) — le release GitHub restano comunque un
# elenco unico per l'intero repo, non solo per RStudy desktop.
publish:
  provider: github
  owner: AlessioQuagliara
  repo: RStudy
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: drizzle
    to: drizzle
  # Contiene la API key Paddle (PADDLE_API): finisce dentro l'app distribuita,
  # vedi il commento di sicurezza in electron/services/paddleClient.ts. Deve
  # esistere al momento della build (pnpm dist:*), altrimenti electron-builder
  # fallisce — crea .env da .env.example prima di buildare.
  - from: .env
    to: .env
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.education
  # Solo dmg: lo zip serve esclusivamente a Squirrel.Mac per l'auto-update
  # (electron/services/updaterService.ts), oggi non funzionante su macOS per
  # mancanza di firma Developer ID (vedi commento gatekeeperAssess sotto) —
  # da reintrodurre quando la firma sarà a posto.
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Richiesto da macOS per mostrare il dialogo di consenso microfono (dettato
  # appunti, electron/main/security.ts::applyPermissionPolicy): senza questa
  # chiave in Info.plist, il sistema nega l'accesso al microfono a monte di
  # Electron, senza alcun prompt.
  extendInfo:
    NSMicrophoneUsageDescription: "RStudy usa il microfono solo per il dettato degli appunti, quando lo attivi tu dal pulsante dedicato."
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # NIENTE ${arch} nel pattern: electron-builder di default (nsis.buildUniversalInstaller,
  # true se non impostato) genera già un installer "universal" che rileva la CPU
  # all'installazione — ma costruisce ANCHE un installer per-architettura in più
  # se il pattern dell'artifactName contiene ${arch} (vedi NsisTarget.js::finishBuild,
  # `pattern.includes("${arch}")`). Con ${arch} rimosso resta solo l'universale:
  # un file invece di tre.
  artifactName: "${productName}-Setup-${version}.${ext}"
linux:
  category: Education
  # Solo AppImage: portabile, gira su qualunque distro senza installazione.
  # Il .deb dava integrazione nativa col menu su Debian/Ubuntu ma non
  # installava su Fedora/Arch/altre distro non-Debian — un file solo, più
  # semplice per chi scarica dalla pagina release.
  target:
    - target: AppImage
      arch: [x64, arm64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
