appId: com.alessioquagliara.rstudy
productName: RStudy
# Icona sorgente unica (1024x1024, generata da assets/img/logo-mark.svg):
# electron-builder deriva automaticamente .icns (mac) e .ico (win) da questo
# PNG in fase di build, niente asset platform-specifici da mantenere a mano.
icon: build/icon.png
directories:
  output: release
# Target di pubblicazione per l'auto-update (electron-updater, vedi
# electron/services/updaterService.ts): pubblica gli installer + i file di
# metadati (latest.yml/latest-mac.yml/latest-linux.yml) come GitHub Release
# taggata "v<version>" sul repo pubblico. Serve un token con permesso
# "contents: write" nella variabile d'ambiente GH_TOKEN al momento della
# build (`GH_TOKEN=... pnpm release:mac`); senza GH_TOKEN electron-builder
# builda normalmente ma non pubblica nulla. NB: repo condiviso con altri
# progetti (web, landing page, ecc.) — le release GitHub restano comunque un
# elenco unico per l'intero repo, non solo per RStudy desktop.
publish:
  provider: github
  owner: AlessioQuagliara
  repo: RStudy
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: drizzle
    to: drizzle
  # Contiene la API key Paddle (PADDLE_API): finisce dentro l'app distribuita,
  # vedi il commento di sicurezza in electron/services/paddleClient.ts. Deve
  # esistere al momento della build (pnpm dist:*), altrimenti electron-builder
  # fallisce — crea .env da .env.example prima di buildare.
  - from: .env
    to: .env
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
linux:
  category: Education
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
